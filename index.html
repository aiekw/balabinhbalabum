<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Một món quà nhỏ dành cho em bé 🌷</title>
<style>
  :root{--pink:#ffe5ef;--deep:#b84c79;--ink:#744253;--paper:#fffaf0}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff9fc 0,transparent 30%),linear-gradient(145deg,#ffe8f0,#ffd5e4 55%,#f9dff5);overflow-x:hidden}
  button,textarea{font:inherit}
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .petal{position:absolute;top:-30px;width:12px;height:18px;background:#ff9fca;border-radius:100% 0 100% 0;opacity:.65;animation:fall linear infinite}
  @keyframes fall{to{transform:translate3d(60px,110vh,0) rotate(620deg)}}
  .screen{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
  .intro{max-width:720px;text-align:center;animation:rise 1.2s both}
  .eyebrow{letter-spacing:.22em;text-transform:uppercase;font:600 11px Arial,sans-serif;color:#bd6d91}
  h1{font-size:clamp(2.5rem,8vw,5.7rem);font-weight:normal;line-height:1.05;margin:20px 0;color:#a63e70}
.intro p {
    font-family: Arial, sans-serif;
    font-size: clamp(16px, 2.5vw, 20px);
    line-height: 1.8;
    width: 100%;
    max-width: 650px;
    margin: 0 auto 28px;
    padding: 0 12px;
    text-align: center;
    word-break: normal;
    overflow-wrap: normal;
    letter-spacing: 0;
}
    .mobile-break {
    display: none;
}

@media (max-width: 600px) {
    .mobile-break {
        display: initial;
    }
}
  .button{border:0;border-radius:999px;padding:15px 27px;background:linear-gradient(120deg,#d95f97,#a948a5);color:white;box-shadow:0 12px 30px #b94c7c44;cursor:pointer;transition:transform .25s,box-shadow .25s}
  .button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 35px #b94c7c66}
  .hint{font:12px Arial,sans-serif;color:#a56c83;margin-top:18px}
  #gift{display:none;flex-direction:column;text-align:center;gap:14px;padding-top:45px;padding-bottom:60px}
  #gift.visible{display:flex;animation:rise .9s both}
  .gift-title{font-weight:normal;font-size:clamp(2rem,6vw,3.5rem);margin:0;color:#a63e70}
.gift-subtitle {
    font-family: Arial, sans-serif;
    margin: 0;
    font-size: 1rem;
    line-height: 1.7;
}
  .stage{width:min(100%,760px);height:470px;position:relative;display:grid;place-items:center;perspective:1100px;isolation:isolate}
  .glow{position:absolute;width:350px;height:350px;border-radius:50%;background:#fff8fd99;filter:blur(25px);z-index:-1}
  #flowerCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
  .bouquet{position:absolute;width:350px;height:410px;left:50%;top:50%;transform:translate(-50%,-47%);filter:drop-shadow(0 20px 14px #9e51722b);pointer-events:none}
  .stem{position:absolute;left:50%;top:40%;height:190px;width:5px;background:linear-gradient(90deg,#43885b,#9fc77b);border-radius:8px;transform-origin:top}
  .stem.s1{transform:rotate(-25deg)}.stem.s2{transform:rotate(-12deg)}.stem.s3{transform:rotate(10deg)}.stem.s4{transform:rotate(24deg)}.stem.s5{transform:rotate(3deg)}
  .leaf{position:absolute;width:55px;height:25px;background:linear-gradient(135deg,#b4d69b,#3f895d);border-radius:100% 0 100% 0;top:60%}
  .leaf.l1{left:24%;transform:rotate(22deg)}.leaf.l2{right:22%;transform:scaleX(-1) rotate(20deg);top:65%}.leaf.l3{left:35%;top:70%;transform:rotate(-12deg)}
  .flower{position:absolute;width:88px;height:88px;display:grid;place-items:center;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
  .flower:before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff4b6 0 10%,transparent 11%),radial-gradient(ellipse at 50% 8%,var(--p) 0 23%,transparent 25%),radial-gradient(ellipse at 90% 35%,var(--p) 0 23%,transparent 25%),radial-gradient(ellipse at 80% 82%,var(--p) 0 23%,transparent 25%),radial-gradient(ellipse at 20% 82%,var(--p) 0 23%,transparent 25%),radial-gradient(ellipse at 10% 35%,var(--p) 0 23%,transparent 25%);filter:drop-shadow(0 4px 2px #7e3b5a22)}
  .flower:after{content:'';width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6bc,#e4a34e 70%);z-index:1}
  .f1{--p:#fa739f;left:13%;top:16%;transform:rotate(-16deg)}.f2{--p:#f8b5d4;left:34%;top:5%;animation-delay:-1s}.f3{--p:#f7d34d;left:55%;top:15%;animation-delay:-2s}.f4{--p:#9c7de8;left:69%;top:28%;animation-delay:-.5s}.f5{--p:#fff7f0;left:25%;top:30%;animation-delay:-1.5s}.f6{--p:#ed5d7c;left:47%;top:29%;animation-delay:-2.5s}.f7{--p:#f5a9c5;left:4%;top:37%;animation-delay:-.8s}.f8{--p:#a8d4ec;left:61%;top:3%;animation-delay:-1.8s}
  @keyframes sway{0%,100%{margin-top:0}50%{margin-top:-7px}}
  .wrap{position:absolute;left:50%;top:57%;width:215px;height:175px;transform:translateX(-50%);background:linear-gradient(125deg,#f7b7d2,#fff0f6 45%,#e99cbd);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);z-index:2;box-shadow:0 10px 15px #9c4d6a33}
  .wrap:before{content:'';position:absolute;left:50%;top:0;height:100%;width:2px;background:#ffffff88}
  .ribbon{position:absolute;z-index:3;left:50%;top:74%;width:75px;height:30px;transform:translateX(-50%);border-radius:50%;border:8px solid #bd4d84;opacity:.9}
  .note{position:absolute;z-index:5;left:50%;top:46%;width:min(330px,78vw);min-height:225px;padding:24px 23px 18px;background:linear-gradient(135deg,#fffdf5,#fff5e9);border:1px solid #ead6b7;box-shadow:0 22px 45px #824a5b30;transform-style:preserve-3d;transform:translate(-50%,85%) rotateX(16deg) rotateY(-7deg) scale(.28);transform-origin:50% 100%;transition:transform .75s cubic-bezier(.2,.8,.2,1), opacity .55s ease;cursor:grab;text-align:left;opacity:0;pointer-events:none}
  .note:before{content:'';position:absolute;inset:8px;border:1px solid #eadcc5;pointer-events:none;transform:translateZ(1px)}
  .note.is-out{transform:translate(-50%,-25%) rotateX(2deg) rotateY(-4deg) scale(1);opacity:1;pointer-events:auto}
  .note-tab{position:absolute;z-index:4;left:calc(50% + 78px);top:56%;width:38px;height:58px;border:1px solid #ead6b7;border-radius:4px 8px 4px 4px;background:linear-gradient(135deg,#fffdf5,#f5e5d4);box-shadow:3px 5px 8px #824a5b25;transform:rotate(8deg);cursor:pointer;color:#bd6d91;font-size:18px;transition:transform .3s}
  .note-tab:hover{transform:translateY(-5px) rotate(8deg)}
  .note.is-out ~ .note-tab{opacity:0;pointer-events:none}
  .note:after{content:'✿';position:absolute;right:18px;top:12px;color:#e9a4bb;font-size:25px;transform:translateZ(4px)}
  .note h2{font-weight:normal;font-size:1.35rem;margin:0 0 12px;color:#b14d78;transform:translateZ(8px)}
 .note textarea {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: 105px;
    resize: vertical;
    border: 0;
    outline: 0;
    background: transparent;
    color: #795063;
    font-family: 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    transform: translateZ(10px);
}
  .note small{display:block;text-align:right;font:10px Arial,sans-serif;letter-spacing:.08em;color:#bd8a9d;transform:translateZ(6px)}
  .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:0}
  .button.secondary{background:#fff9fc;color:#a34873;border:1px solid #efbfd3;box-shadow:none}
  .footer{font:12px Arial,sans-serif;color:#aa7188;margin-top:6px}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.stage{height:560px}.bouquet{transform:translate(-50%,-64%) scale(.82)}.note{top:43%;width:min(320px,86vw);min-height:205px}.note.is-out{transform:translate(-50%,-5%) rotateX(2deg) rotateY(-4deg) scale(1)}.note-tab{left:calc(50% + 68px);top:51%}.wrap{top:46%;transform:translateX(-50%) scale(.86)}.ribbon{top:61%}.flower{transform-origin:50% 100%}.gift-subtitle{max-width:340px}.note textarea{height:92px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main>
  <section class="screen" id="intro">
    <div class="intro">
      <div class="eyebrow">A little something, just for you</div>
      <h1>Chúc mừng<br>ngày 20/10 🌷</h1>
      <p>Chúc Nhumy của anh luôn xinh đẹp, dịu dàng, hạnh phúc và<br class="mobile-break"> được yêu thật nhiều</p>
      <button class="button" id="openGift">🎁 Quà tặng</button>
    </div>
  </section>
  <section class="screen" id="gift" aria-hidden="true">
    <p class="eyebrow">For someone special</p>
    <h2 class="gift-title">Tặng em bé một bó hoa  💐</h2>
    <p class="gift-subtitle">Có tấm thiệp kìa, mở ra xem đi 💌</p>
    <div class="stage" id="stage">
      <div class="glow"></div>
      <canvas id="flowerCanvas" aria-label="Bó nụ cẩm ly 3D nhiều màu sắc"></canvas>
      <button class="note-tab" id="noteTab" aria-label="Lấy tấm thiệp ra">✉</button>
      <article class="note" id="note">
        <h2>Gửi em bé của anh,</h2>
        <textarea id="message" maxlength="500" aria-label="Lời nhắn trên tờ giấy">Chúc em bé của anh 20/10 luôn xinh, học hành chăm hơn và ít bệnh lại. Đ cần tuổi mới anh cũng chúc em bé của anh năm nay đậu nguyện vọng 1 và được anh dẫn đi chơi tốt nghiệp 💗</textarea>
        <small>bông viết chung với bố á🐑💗</small>
      </article>
    </div>
    <div class="controls">
      <button class="button secondary" id="backButton">← Quay lại lời chúc</button>
    </div>
  </section>
</main>
<script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('flowerCanvas');
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
  camera.position.set(0, 0.2, 11.5);

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);

  scene.add(new THREE.HemisphereLight(0xfff4fa, 0x87606d, 2.2));
  const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
  keyLight.position.set(-3, 5, 8);
  scene.add(keyLight);
  const pinkLight = new THREE.PointLight(0xff9bc8, 24, 16);
  pinkLight.position.set(3, 1, 4);
  scene.add(pinkLight);

  const bouquet = new THREE.Group();
  scene.add(bouquet);
  const flowerGroups = [];

  function material(color, roughness = 0.52) {
    return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.0, side: THREE.DoubleSide });
  }

  // Cánh cẩm ly đã nở: bản rộng ở giữa, nhọn ở đầu, hơi cong và lõm nhẹ.
  // Trục Y chạy từ tâm bông hoa ra ngoài; sáu cánh xòe thành hình sao.
  function makeTaperedPetalGeometry(length, maxWidth, bend = 0.08) {
    const rows = 24, cols = 12;
    const vertices = [], indices = [], uvs = [];
    for (let r = 0; r <= rows; r++) {
      const t = r / rows;
      const widthProfile = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.88)), 0.62) * (0.82 + 0.18*t);
      for (let c = 0; c <= cols; c++) {
        const u = (c / cols) * 2 - 1;
        const x = u * maxWidth * widthProfile;
        const y = t * length;
        const z = bend * Math.sin(Math.PI * t) + (u*u) * maxWidth * 0.12;
        vertices.push(x, y, z);
        uvs.push(c / cols, t);
      }
    }
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const a = r * (cols + 1) + c, b = a + cols + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices); geo.computeVertexNormals();
    return geo;
  }

  function addLilyBud(x, y, z, color, size, petalCount, seed) {
    const bloom = new THREE.Group();
    bloom.position.set(x, y, z);
    // Mặt hoa hướng lên trên và hơi về phía người xem.
    bloom.rotation.x = -0.12 + (seed % 3) * 0.035;
    bloom.rotation.y = (seed % 5) * 0.13;
    bloom.rotation.z = (seed % 3 - 1) * 0.06;
    bouquet.add(bloom);

    const palette = new THREE.Color(color);
    const petalMat = new THREE.MeshStandardMaterial({ color: palette, roughness: 0.42, side: THREE.DoubleSide });
    const length = size * 1.10;
    const width = size * 0.31;
    // Sáu cánh lớn xòe tròn như cẩm ly; ba cánh sau lệch góc để tạo nhiều lớp.
    for (let i = 0; i < 6; i++) {
      const petal = new THREE.Mesh(makeTaperedPetalGeometry(length * (i % 2 ? 0.94 : 1), width, size * 0.12), petalMat.clone());
      petal.rotation.z = i * Math.PI / 3 + (seed % 2) * 0.12;
      petal.rotation.x = -0.08 - (i % 2) * 0.06;
      petal.position.y = -size * 0.12;
      petal.position.z = (i % 2) * 0.018;
      bloom.add(petal);
    }
    // Cánh trong màu nhạt hơn, xòe xen kẽ tạo độ dày của bông hoa.
    const innerColor = palette.clone().lerp(new THREE.Color('#fff0f5'), 0.22);
    for (let i = 0; i < 3; i++) {
      const petal = new THREE.Mesh(makeTaperedPetalGeometry(length * 0.76, width * 0.72, size * 0.09), material('#' + innerColor.getHexString(), 0.48));
      petal.rotation.z = i * Math.PI * 2 / 3 + Math.PI / 6;
      petal.position.y = -size * 0.06; petal.position.z = 0.035;
      bloom.add(petal);
    }
    // Nhụy và cụm nhị nhỏ ở chính giữa, không bị che khuất.
    const center = new THREE.Mesh(new THREE.SphereGeometry(size * 0.115, 16, 12), material('#d9a13c', 0.4));
    center.position.set(0, size * 0.02, 0.12); bloom.add(center);
    for (let i = 0; i < 5; i++) {
      const angle = i * Math.PI * 2 / 5;
      const filament = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.014, size * 0.22, 6), material('#e8bd63'));
      filament.position.set(Math.cos(angle) * size * 0.09, size * 0.13, 0.12);
      filament.rotation.z = -Math.cos(angle) * 0.25; filament.rotation.x = Math.sin(angle) * 0.2; bloom.add(filament);
      const anther = new THREE.Mesh(new THREE.SphereGeometry(size * 0.035, 8, 6), material('#a96d39'));
      anther.position.set(Math.cos(angle) * size * 0.10, size * 0.24, 0.12); bloom.add(anther);
    }

    flowerGroups.push({ group: bloom, baseY: y, phase: seed * 0.7 });
    const start = new THREE.Vector3(x * 0.98, y - size * 0.16, z - 0.03);
    const end = new THREE.Vector3(x * 0.22, -2.35 + Math.abs(x) * 0.12, z - 0.18);
    const direction = new THREE.Vector3().subVectors(end, start);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.045, direction.length(), 8), material('#43865b'));
    stem.position.copy(start).add(end).multiplyScalar(0.5);
    stem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize()); bouquet.add(stem);

    for (const side of [-1, 1]) {
      const leaf = new THREE.Mesh(makeTaperedPetalGeometry(size * 1.05, size * 0.17, size * 0.045), material(seed % 2 ? '#6eaa72' : '#91bd7d', 0.7));
      leaf.position.set(x * 0.40 + side * size * 0.12, y - size * (0.62 + (seed % 2) * 0.16), z + 0.04);
      leaf.rotation.z = side * (0.65 + (seed % 2) * 0.12); leaf.rotation.y = side * 0.35; bouquet.add(leaf);
    }
  }
  const flowers = [
    [-1.55, 1.05, 0.15, '#f35d91', 0.78, 8],
    [-0.72, 1.62, 0.45, '#ffb5d1', 0.76, 7],
    [ 0.25, 1.48, 0.20, '#ffd65c', 0.72, 8],
    [ 1.18, 1.00, 0.40, '#a88af0', 0.70, 7],
    [ 1.68, 0.30, 0.05, '#8fd3ee', 0.65, 8],
    [-1.05, 0.55, 0.55, '#fff6ed', 0.72, 9],
    [-0.05, 0.70, 0.75, '#ed6680', 0.77, 8],
    [ 0.78, 0.40, 0.62, '#f69bc4', 0.69, 7],
    [-1.72,-0.05, 0.10, '#f4a64c', 0.62, 8],
    [-0.65,-0.10, 0.70, '#d6a4ef', 0.65, 8],
    [ 0.42,-0.10, 0.85, '#f9c4d8', 0.63, 9],
    [ 1.35,-0.12, 0.25, '#e9569a', 0.62, 8]
  ];
  flowers.forEach((f, i) => addLilyBud(...f, i + 1));

  function foldedPanel(points, color, z, opacity = 0.98) {
    const shape = new THREE.Shape();
    shape.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
    shape.closePath();
    const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({color, roughness:0.82, side:THREE.DoubleSide, transparent:opacity<1, opacity}));
    mesh.position.z = z; bouquet.add(mesh); return mesh;
  }
  foldedPanel([[-1.85,0.15],[-1.45,0.85],[-0.52,0.15],[-0.95,-1.35]], '#f8c8d9', -0.28);
  foldedPanel([[1.78,0.25],[1.48,0.90],[0.48,0.18],[0.95,-1.35]], '#f3b4cd', -0.24);
  foldedPanel([[-1.55,0.05],[-0.75,0.55],[0.02,-0.25],[-0.32,-1.82],[-1.20,-1.25]], '#fff0f5', 0.20);
  foldedPanel([[1.55,0.05],[0.72,0.55],[-0.02,-0.25],[0.34,-1.82],[1.20,-1.25]], '#e99bb9', 0.22);
  foldedPanel([[-1.25,-0.45],[0,-0.95],[1.25,-0.45],[0.72,-2.55],[-0.70,-2.55]], '#f6bfd4', 0.30);
  foldedPanel([[-0.90,-0.75],[0,-1.10],[0.92,-0.75],[0.50,-2.50],[-0.48,-2.50]], '#fbdce7', 0.34);

  foldedPanel([[-1.45,0.05],[-0.75,0.55],[-0.30,-1.80],[-0.70,-1.45]], '#fff5f8', 0.38, 0.72);
  foldedPanel([[1.45,0.05],[0.75,0.55],[0.30,-1.80],[0.70,-1.45]], '#d985a8', 0.39, 0.58);

  const bowMat = material('#bd4d84');
  const bowLeft = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.055, 8, 24, Math.PI * 1.7), bowMat);
  bowLeft.position.set(-0.18, -1.70, 0.72); bowLeft.rotation.z = 0.5; bouquet.add(bowLeft);
  const bowRight = bowLeft.clone(); bowRight.position.x = 0.18; bowRight.rotation.z = Math.PI - 0.5; bouquet.add(bowRight);
  const bowKnot = new THREE.Mesh(new THREE.SphereGeometry(0.10, 14, 10), bowMat);
  bowKnot.position.set(0, -1.70, 0.77); bouquet.add(bowKnot);
  const ribbonMat = material('#d58aa8');
  for (const side of [-1,1]) {
    const ribbon = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.92, 0.025), ribbonMat);
    ribbon.position.set(side*0.20, -2.18, 0.73); ribbon.rotation.z = side*0.08; bouquet.add(ribbon);
  }

  bouquet.position.set(-0.65, 0.05, 0);
  bouquet.scale.setScalar(1.0);

  function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.position.z = width < 600 ? 13.8 : 11.5;
    camera.updateProjectionMatrix();
    bouquet.scale.setScalar(width < 600 ? 0.84 : 1.0);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let pointerX = 0, pointerY = 0;
  stage.addEventListener('pointermove', event => {
    const rect = stage.getBoundingClientRect();
    pointerX = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
    pointerY = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
  });
  stage.addEventListener('pointerleave', () => { pointerX = 0; pointerY = 0; });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    bouquet.rotation.y += ((pointerX * 0.20) - bouquet.rotation.y) * 0.035;
    bouquet.rotation.x += ((-pointerY * 0.09) - bouquet.rotation.x) * 0.035;
    bouquet.position.y = 0.05 + Math.sin(t * 0.8) * 0.055;
    flowerGroups.forEach(({ group, baseY, phase }) => {
      group.position.y = baseY + Math.sin(t * 1.25 + phase) * 0.035;
      group.rotation.z += Math.sin(t + phase) * 0.0007;
    });
    renderer.render(scene, camera);
  }
  animate();
</script>

<script>
  const petals = document.getElementById('petals');
  for (let i = 0; i < 24; i++) {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDuration = (8 + Math.random() * 12) + 's';
    petal.style.animationDelay = (-Math.random() * 18) + 's';
    petal.style.opacity = (0.2 + Math.random() * 0.55).toString();
    petals.appendChild(petal);
  }

  const intro = document.getElementById('intro');
  const gift = document.getElementById('gift');
  document.getElementById('openGift').addEventListener('click', () => {
    intro.style.display = 'none';
    gift.classList.add('visible');
    gift.setAttribute('aria-hidden', 'false');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.getElementById('backButton').addEventListener('click', () => {
    gift.classList.remove('visible');
    gift.setAttribute('aria-hidden', 'true');
    intro.style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const stage = document.getElementById('stage');
  const note = document.getElementById('note');
  const noteTab = document.getElementById('noteTab');
 function toggleNote() {
    const isOut = note.classList.toggle('is-out');
    noteTab.setAttribute('aria-expanded', String(isOut));

    if (isOut) {
        const message = document.getElementById('message');
        message.scrollTop = 0;
        message.setSelectionRange(0, 0);
    } else {
        note.style.transform = '';
    }
}
  noteTab.addEventListener('click', toggleNote);
  function tiltNote(clientX, clientY) {
    if (!note.classList.contains('is-out')) return;
    const rect = note.getBoundingClientRect();
    const x = (clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
    const y = (clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
    const rotateY = Math.max(-13, Math.min(13, x * 11));
    const rotateX = Math.max(-10, Math.min(10, -y * 8));
    note.style.transform = `translate(-50%,-25%) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1)`;
  }
  stage.addEventListener('pointermove', e => tiltNote(e.clientX, e.clientY));
  stage.addEventListener('pointerleave', () => {
    if (note.classList.contains('is-out')) note.style.transform = '';
  });
  stage.addEventListener('touchmove', e => {
    if (e.touches.length) tiltNote(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  note.addEventListener('dblclick', () => note.classList.remove('is-out'));
document.addEventListener("click", function (event) {
    if (
        note.classList.contains("is-out") &&
        !note.contains(event.target) &&
        !noteTab.contains(event.target)
    ) {
        note.classList.remove("is-out");
        note.style.transform = "";
        noteTab.setAttribute("aria-expanded", "false");
    }
});

</script>
</body>
